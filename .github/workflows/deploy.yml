name: "Deploy to WordPress.org"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  deploy:
    uses: joshuadavidnelson/ci/.github/workflows/wp-deploy.yml@v1
    permissions:
      actions: read
      contents: read
    with:
      slug: "scripts-to-footerphp"
      required-workflows: |
        Integrate
    secrets: inherit
