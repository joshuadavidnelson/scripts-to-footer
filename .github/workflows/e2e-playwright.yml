name: "E2E Tests"

on:
  pull_request:
    branches:
    - stable
    - develop
    - "release/**"
  workflow_dispatch: null

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  playwright:
    name: "WP ${{ matrix.wp }} / PHP ${{ matrix.php }} E2E"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    # Development WordPress (master) is upstream code, so its leg reports
    # but never blocks.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # .wp-env.test.json phpVersion: parity with local runs.
        - wp: "latest"
          php: "8.3"
          experimental: false
        # Top of the supported PHP range (readme.txt changelog, integrate.yml).
        - wp: "latest"
          php: "8.5"
          experimental: false
        # readme.txt "Tested up to".
        - wp: "7.1"
          php: "8.4"
          experimental: false
        # Plugin header floor: "Requires at least: 6.2", "Requires PHP: 8.1".
        - wp: "6.2"
          php: "8.1"
          experimental: false
        # Development WordPress, for early warning on upstream core changes.
        - wp: "master"
          php: "8.4"
          experimental: true

    env:
      # wp-env reads this on every invocation.
      WP_ENV_PHP_VERSION: "${{ matrix.php }}"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v7"
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install npm dependencies"
      run: "npm ci"

    - name: "Typecheck the e2e suite"
      run: "npm run typecheck"

    - name: "Resolve the Playwright version"
      id: "playwright"
      run: |
        VERSION="$(node -p "require('@playwright/test/package.json').version")"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

    - name: "Cache the Playwright browser"
      id: "playwright-cache"
      uses: "actions/cache@v6"
      with:
        path: "~/.cache/ms-playwright"
        key: "playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}"

    - name: "Install the Playwright browser"
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          # The cache holds the browser but not the apt packages it links against.
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: "Pin the WordPress core version"
      env:
        STF_WP_VERSION: "${{ matrix.wp }}"
      run: |
        npm run test:e2e:core-version -- "${STF_WP_VERSION}"
        cat .wp-env.test.override.json || echo "No override written: latest stable."

    - name: "Start wp-env"
      timeout-minutes: 30
      run: "npm run env:test:start"

    - name: "Report the environment under test"
      run: |
        npx wp-env --config=.wp-env.test.json run cli -- wp core version
        npx wp-env --config=.wp-env.test.json run cli -- php -r 'echo PHP_VERSION, PHP_EOL;'

    - name: "Browser suite"
      env:
        # wp-scripts otherwise runs a bare `playwright install`, downloading
        # Firefox and WebKit on top of the cached Chromium.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      run: "npm run test:e2e"

    # Always, not just on failure: a PHP notice or deprecation usually breaks
    # no assertion, so on a green run it would otherwise never be seen.
    - name: "Collect the WordPress debug log"
      id: "debug-log"
      if: always()
      run: |
        mkdir -p artifacts
        # The inner `|| true` covers a site that logged nothing; a failure of
        # wp-env itself still fails this step instead of passing as "empty".
        npx wp-env --config=.wp-env.test.json run cli -- \
          sh -c 'cat /var/www/html/wp-content/debug.log 2>/dev/null || true' > artifacts/debug.log

    - name: "Check the debug log for PHP diagnostics"
      if: always() && steps.debug-log.outcome == 'success'
      env:
        LEG: "WP ${{ matrix.wp }} / PHP ${{ matrix.php }}"
      run: |
        test -s artifacts/debug.log || { echo "debug.log is empty: nothing was logged."; exit 0; }

        DIAG="PHP (Warning|Deprecated|Notice)"
        # Diagnostics raised from the plugin's own files, listed first so they
        # aren't buried under core and theme noise.
        if grep -E "${DIAG}" artifacts/debug.log | grep -q "/plugins/scripts-to-footer/"; then
          echo "::warning title=Plugin PHP diagnostics::${LEG}: scripts-to-footer logged PHP diagnostics; see the debug.log artifact."
          grep -E "${DIAG}" artifacts/debug.log | grep "/plugins/scripts-to-footer/" | sed -E 's/^\[[^]]*\] //' | sort -u | head -40
        fi

        if grep -E "${DIAG}" artifacts/debug.log | grep -vq "/plugins/scripts-to-footer/"; then
          echo "::warning title=Other PHP diagnostics::${LEG}: core, theme or fixture code logged PHP diagnostics; see the debug.log artifact."
          grep -E "${DIAG}" artifacts/debug.log | grep -v "/plugins/scripts-to-footer/" | sed -E 's/^\[[^]]*\] //' | sort -u | head -20
        fi

        if grep -q "PHP Fatal error" artifacts/debug.log; then
          echo "::error title=PHP fatal::A PHP fatal error was logged during the run."
          grep "PHP Fatal error" artifacts/debug.log | sort -u | head -20
          exit 1
        fi

    - name: "Upload artifacts"
      if: always()
      uses: "actions/upload-artifact@v4"
      with:
        name: "e2e-wp${{ matrix.wp }}-php${{ matrix.php }}-${{ github.run_id }}"
        path: "artifacts/"
        retention-days: 7
