name: "E2E Tests"

on:
  pull_request:
    branches:
    - stable
    - develop
  workflow_dispatch: null

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  playwright:
    name: "WP ${{ matrix.wp }} / PHP ${{ matrix.php }} E2E"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    # Legs marked `experimental` report but never block: development
    # WordPress (master) is upstream code, and the floor leg is documented in
    # the README's E2E section.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # .wp-env.test.json phpVersion: parity with local runs.
        - wp: "latest"
          php: "8.3"
          experimental: false
        # Top of the supported PHP range (readme.txt changelog, integrate.yaml).
        - wp: "latest"
          php: "8.5"
          experimental: false
        # readme.txt "Tested up to".
        - wp: "7.1"
          php: "8.4"
          experimental: false
        # Plugin header floor: "Requires at least: 5.3", "Requires PHP: 7.4".
        - wp: "5.3"
          php: "7.4"
          experimental: true
        # Development WordPress, for early warning on upstream core changes.
        - wp: "master"
          php: "8.4"
          experimental: true

    env:
      # wp-env reads this on every invocation.
      WP_ENV_PHP_VERSION: "${{ matrix.php }}"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v4"
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install npm dependencies"
      run: "npm ci"

    - name: "Typecheck the e2e suite"
      run: "npm run typecheck"

    - name: "Resolve the Playwright version"
      id: "playwright"
      run: |
        VERSION="$(node -p "require('@playwright/test/package.json').version")"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

    - name: "Cache the Playwright browser"
      id: "playwright-cache"
      uses: "actions/cache@v4"
      with:
        path: "~/.cache/ms-playwright"
        key: "playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}"

    - name: "Install the Playwright browser"
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          # The cache holds the browser but not the apt packages it links against.
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: "Pin the WordPress core version"
      env:
        STF_WP_VERSION: "${{ matrix.wp }}"
      run: |
        npm run test:e2e:core-version -- "${STF_WP_VERSION}"
        cat .wp-env.test.override.json || echo "No override written: latest stable."

    - name: "Start wp-env"
      timeout-minutes: 30
      run: "npm run env:test:start"

    - name: "Report the environment under test"
      run: |
        npx wp-env --config=.wp-env.test.json run cli -- wp core version
        npx wp-env --config=.wp-env.test.json run cli -- php -r 'echo PHP_VERSION, PHP_EOL;'

    - name: "Browser suite"
      run: "npm run test:e2e"

    # Always, not just on failure: a PHP notice or deprecation usually breaks
    # no assertion, so on a green run it would otherwise never be seen.
    - name: "Collect the WordPress debug log"
      if: always()
      continue-on-error: true
      run: |
        mkdir -p artifacts
        npx wp-env --config=.wp-env.test.json run cli -- cat /var/www/html/wp-content/debug.log > artifacts/debug.log 2>/dev/null || true

    - name: "Check the debug log for PHP diagnostics"
      if: always()
      env:
        LEG: "WP ${{ matrix.wp }} / PHP ${{ matrix.php }}"
      run: |
        test -s artifacts/debug.log || exit 0

        if grep -qE "PHP (Warning|Deprecated|Notice)" artifacts/debug.log; then
          echo "::warning title=PHP diagnostics::${LEG} logged PHP diagnostics; see the debug.log artifact."
          grep -E "PHP (Warning|Deprecated|Notice)" artifacts/debug.log | sort -u | head -40
        fi

        if grep -q "PHP Fatal error" artifacts/debug.log; then
          echo "::error title=PHP fatal::A PHP fatal error was logged during the run."
          grep "PHP Fatal error" artifacts/debug.log | sort -u | head -20
          exit 1
        fi

    - name: "Upload artifacts"
      if: always()
      uses: "actions/upload-artifact@v4"
      with:
        name: "e2e-wp${{ matrix.wp }}-php${{ matrix.php }}-${{ github.run_id }}"
        path: "artifacts/"
        retention-days: 7
