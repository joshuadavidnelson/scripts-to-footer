name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php }}

    - name: "PHP lint"
      run: "composer lint"

  coding-standard:
    name: "Check coding standard"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-8.4-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-8.4-

    - name: "Install Composer Packages"
      run: "composer install"

    - name: "Run PHPCS"
      run: "composer phpcs"

  static-analysis:
    name: "Run static analysis"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-8.4-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-8.4-

    - name: "Install Composer Packages"
      run: "composer install"

    - name: "Run PHPStan"
      run: "composer phpstan"

  npm:
    name: "Install and audit npm packages"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install Node"
      uses: "actions/setup-node@v4"
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install npm packages"
      run: "npm ci --ignore-scripts"

    - name: "Check wp-env runs"
      run: "npx wp-env --version"

    - name: "Audit npm packages"
      run: "npm audit --audit-level=high"

  phpunit:
    name: "PHPUnit unit tests (PHP ${{ matrix.php }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # Composer floor (composer.json "php": ">=8.1") and the newest supported version.
        php: ['8.1', '8.5']
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php }}
        coverage: "none"

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ matrix.php }}-

    - name: "Install Composer Packages"
      run: "composer install --no-interaction --no-progress"

    - name: "Run PHPUnit"
      run: "composer test"

  coverage:
    name: "PHPUnit coverage (>= 90% lines)"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
        coverage: "xdebug"

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-8.4-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-8.4-

    - name: "Install Composer Packages"
      run: "composer install --no-interaction --no-progress"

    - name: "Run PHPUnit with coverage"
      run: "composer test:coverage-clover"

    # The base-branch comparison and artifact come before the floor check so a
    # PR that breaks the floor still gets its comment. Until the base carries
    # the test suite its coverage cannot be measured, which is expected: the
    # report then shows the PR's numbers alone.
    - name: "Checkout base branch for comparison"
      if: github.event_name == 'pull_request'
      uses: "actions/checkout@v6"
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: ".base"
        persist-credentials: false

    - name: "Measure base branch coverage"
      if: github.event_name == 'pull_request'
      continue-on-error: true
      working-directory: ".base"
      run: |
        if [ -f phpunit.xml.dist ] && grep -q '"test:coverage-clover"' composer.json; then
          composer install --no-interaction --no-progress
          composer test:coverage-clover
        else
          echo "::notice::Base branch has no coverage script, so the report will omit the delta."
        fi

    - name: "Collect coverage for the report"
      if: github.event_name == 'pull_request'
      run: |
        mkdir -p pr-coverage
        cp coverage/clover.xml pr-coverage/clover.xml
        cp .base/coverage/clover.xml pr-coverage/base-clover.xml \
          || echo "::notice::No base coverage, so the report will omit the delta."

    - name: "Upload coverage"
      if: github.event_name == 'pull_request'
      uses: "actions/upload-artifact@v4"
      with:
        name: "pr-coverage"
        path: "pr-coverage"
        retention-days: 14

    - name: "Enforce the line coverage floor"
      # The floor lives in quality-thresholds.json, shared with the PR report.
      run: "composer test:coverage-check"

  workflow-scripts:
    name: "Workflow script tests"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install Node"
      uses: "actions/setup-node@v4"
      with:
        node-version: "24"

    - name: "Run workflow script tests"
      # Node built-ins only: no npm install. The glob is quoted so Node, not
      # the shell, expands it.
      run: 'node --test ".github/scripts/*.test.js"'

  # The only job that writes to the pull request. It runs no project code
  # beyond the renderer in .github/scripts and performs no checks: it reads
  # the artifact the coverage job produced and posts it. It runs even when
  # coverage failed, so a floor breach is visible in the comment.
  #
  # Fork PRs: the token of a pull_request run from a fork is read-only, so
  # the posting step cannot comment there. That is a missing comment, never
  # a failed build, and no secret or write token is exposed to fork code.
  report:
    name: "PR coverage report"
    runs-on: "ubuntu-latest"
    needs: coverage
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
      with:
        persist-credentials: false

    - name: "Install Node"
      uses: "actions/setup-node@v4"
      with:
        node-version: "24"

    - name: "Download coverage"
      id: download
      # Missing when the coverage job failed before uploading; nothing to report then.
      continue-on-error: true
      uses: "actions/download-artifact@v4"
      with:
        name: "pr-coverage"
        path: "pr-coverage"

    - name: "Render the report"
      if: steps.download.outcome == 'success'
      run: "node .github/scripts/render-pr-report.js"
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: "Post the report"
      if: steps.download.outcome == 'success'
      uses: "actions/github-script@v7"
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('pr-coverage/pr-report.md', 'utf8');
          // The renderer's first line is the hidden marker identifying our comment.
          const marker = body.split('\n')[0];
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (error) {
            core.warning(`Could not post the coverage comment (read-only token on a fork PR?): ${error.message}`);
          }

  integration:
    name: "Integration tests (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})"
    runs-on: "ubuntu-latest"
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: "latest"
            php: "8.3"
            experimental: false
          # Oldest WordPress whose test library runs on the PHP floor with PHPUnit 9.
          - wp: "6.2"
            php: "8.1"
            experimental: false
          - wp: "trunk"
            php: "8.4"
            experimental: true
    services:
      mysql:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: "root"
          MYSQL_DATABASE: "wordpress_test"
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CORE_DIR: "/tmp/wordpress/"
      WP_TESTS_DIR: "/tmp/wordpress-tests-lib"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php }}
        extensions: "mysqli"
        coverage: "none"

    - name: "Install Subversion"
      run: "sudo apt-get update -q && sudo apt-get install -y -q subversion"

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ matrix.php }}-

    - name: "Install Composer Packages"
      run: "composer install --no-interaction --no-progress"

    - name: "Install WordPress and the test library"
      run: "bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true"

    - name: "Run integration tests"
      run: "composer test:integration"
