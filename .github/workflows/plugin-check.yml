name: "WP Plugin Check"

on:
  pull_request: null
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  plugin-check:
    name: "Run Plugin Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # Plugin Check scans the checkout, not the WordPress.org zip, so the
      # exclusions mirror what .distignore keeps out of the zip. The
      # PrefixAllGlobals codes are ignored because Plugin Check derives the
      # expected prefix from the slug (scripts_to_footerphp_), while the plugin
      # uses its own stf_ prefix, which is part of its public API.
      - name: "Run Plugin Check"
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: "vendor,node_modules,tests,.github,.git,.wordpress-org,bin,reports"
          exclude-files: "package.json,package-lock.json,composer.json,composer.lock,contributing.md,code-of-conduct.md,phpstan.neon.dist,phpunit.xml.dist,phpmd.xml,phpmd.baseline.xml,quality-thresholds.json,readme.md,changelog.md,.phpcs.xml.dist,.wp-env.json,.distignore,.gitattributes,.editorconfig,LICENSE.txt"
          ignore-codes: "hidden_files,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedFunctionFound,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound"
