name: "Tests"

on: workflow_call

permissions:
  contents: read

jobs:
  unit:
    name: "Unit tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.5"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          tools: composer

      - name: "Get Composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer packages"
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: "Install Composer packages"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Run unit tests"
        run: composer test

  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Checkout the base branch for comparison"
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer

      - name: "Get Composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer packages"
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      - name: "Install Composer packages"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Run unit tests with coverage"
        run: |
          composer phpunit:coverage-clover
          test -s coverage/php-clover.xml || {
            echo "::error::PHPUnit wrote no clover report for this branch."
            exit 1
          }
          mkdir -p reports/coverage
          cp coverage/php-clover.xml reports/coverage/php-clover.xml

      # The base is measured with its own test setup, so a base that predates
      # the PHPUnit scripts is skipped and the report omits the comparison.
      - name: "Measure coverage on the base branch"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: .base
        run: |
          if ! composer run-script --list --no-interaction | grep -q 'phpunit:coverage-clover'; then
            echo "::notice::The base branch has no phpunit:coverage-clover script; the report will omit the coverage comparison."
            exit 0
          fi
          composer install --no-interaction --no-progress --prefer-dist
          composer phpunit:coverage-clover
          cp coverage/php-clover.xml "$GITHUB_WORKSPACE/reports/coverage/php-base-clover.xml"

      - name: "Upload the report section"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-coverage
          path: |
            reports/coverage/php-clover.xml
            reports/coverage/php-base-clover.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: "Install Node"
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Enforce the coverage floors"
        run: node .github/scripts/check-coverage.js

  integration:
    name: "Integration tests (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: "latest"
            php: "8.3"
            experimental: false
          # The WordPress minimum ("Requires at least: 6.2") on the PHP floor.
          - wp: "6.2"
            php: "8.1"
            experimental: false
          - wp: "trunk"
            php: "8.4"
            experimental: true
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CORE_DIR: /tmp/wordpress/
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: mysqli
          coverage: none
          tools: composer

      - name: "Install Subversion"
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion

      - name: "Get Composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: "Cache Composer packages"
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: "Install Composer packages"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Install WordPress and the test library"
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: "Run integration tests"
        run: composer test:integration
