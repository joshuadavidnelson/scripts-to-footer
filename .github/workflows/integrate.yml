name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  php:
    uses: joshuadavidnelson/ci/.github/workflows/php-plugin.yml@v1
    with:
      php-versions: '["8.1", "8.2", "8.3", "8.4", "8.5"]'
      source-paths: "scripts-to-footer.php uninstall.php includes/"
      # No PHPUnit suite in this release yet, so the tests job runs
      # `composer phpunit` (a no-op until phpunit.xml.dist exists) and
      # coverage is not collected. Turn coverage on, and with it the
      # coverage floors in quality-thresholds.json, when the test stack lands.
      coverage: false

  npm:
    name: "Install and audit npm packages"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install Node"
      uses: "actions/setup-node@v4"
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install npm packages"
      run: "npm ci --ignore-scripts"

    - name: "Check wp-env runs"
      run: "npx wp-env --version"

    - name: "Audit npm packages"
      run: "npm audit --audit-level=high"
