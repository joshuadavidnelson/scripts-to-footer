version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "stable"
    schedule:
      interval: "daily"
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "stable"
    schedule:
      interval: "daily"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Keep @types/node on the major matching the Node engine (>=24) in package.json.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "stable"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
